<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueprint Prototype</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
  #cy { background: #fafafa; }
  aside { padding: 12px 16px; overflow: auto; border-left: 1px solid #ddd; }
  header { position: absolute; top: 8px; left: 8px; z-index: 2; }
  button { padding: 6px 12px; margin-right: 4px; cursor: pointer; }
  button.on { background: #1f6feb; color: #fff; border: 1px solid #1f6feb; }
  code { background: #eee; padding: 0 3px; border-radius: 3px; }
  li { margin: 2px 0; }
</style>
</head>
<body>
<header><button id="b-struct">Struttura (import)</button><button id="b-pipe">Pipeline (LangGraph)</button></header>
<div id="cy"></div>
<aside id="side"><b>Clicca un nodo o un arco</b> per leggerne la descrizione.</aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script src="blueprint.js"></script>
<script src="descriptions.js"></script>
<script>
const side = document.getElementById("side");
const HIDE = new Set(["src", "__main__"]);

function elements(view) {
  const v = BP[view];
  const nodes = v.nodes.filter(n => !HIDE.has(n.id));
  const ids = new Set(nodes.map(n => n.id));
  return [
    ...nodes.map(n => ({ data: { ...n, label: n.id, view } })),
    ...v.edges.filter(e => ids.has(e.source) && ids.has(e.target)).map((e, i) => ({
      data: { ...e, id: "e" + i, label: e.label || "", view },
      classes: e.conditional ? "cond" : "",
    })),
  ];
}

const cy = cytoscape({
  container: document.getElementById("cy"),
  style: [
    { selector: "node", style: { label: "data(label)", "text-wrap": "wrap", "text-valign": "center", "background-color": "#dbeafe", "border-width": 1, "border-color": "#1f6feb", shape: "round-rectangle", width: "label", height: "label", padding: 10, "font-size": 11 } },
    { selector: "edge", style: { "curve-style": "bezier", "target-arrow-shape": "triangle", "line-color": "#888", "target-arrow-color": "#888", label: "data(label)", "font-size": 9, "text-wrap": "ellipsis", "text-max-width": 140, "text-background-color": "#fafafa", "text-background-opacity": 1 } },
    { selector: "edge.cond", style: { "line-style": "dashed", "line-color": "#d97706", "target-arrow-color": "#d97706" } },
    { selector: ":selected", style: { "border-color": "#dc2626", "border-width": 3, "line-color": "#dc2626" } },
  ],
});

function show(view) {
  cy.elements().remove();
  cy.add(elements(view));
  cy.layout(view === "structure"
    ? { name: "cose", animate: false, nodeRepulsion: 40000, idealEdgeLength: 140 }
    : { name: "breadthfirst", directed: true, roots: "#START", spacingFactor: 1.2 }).run();
  document.getElementById("b-struct").classList.toggle("on", view === "structure");
  document.getElementById("b-pipe").classList.toggle("on", view === "pipeline");
}

const panel = (title, text) => { side.innerHTML = ""; const h = document.createElement("h3"), p = document.createElement("p"); h.textContent = title; p.textContent = text; side.append(h, p); };
cy.on("tap", "node", e => {
  const d = e.target.data();
  panel(d.id, DESC.nodes[d.view][d.id] || "Nessuna descrizione.");
});
cy.on("tap", "edge", e => {
  const d = e.target.data();
  // la vista struttura non ha descrizioni di arco: frase minima senza dettagli tecnici
  const text = d.view === "pipeline" ? DESC.edges.pipeline[`${d.source}->${d.target}|${d.label}`] : `${d.source} usa ${d.target}.`;
  panel(`${d.source} → ${d.target}`, text || "Passaggio nell'ordine di esecuzione della pipeline.");
});

document.getElementById("b-struct").onclick = () => show("structure");
document.getElementById("b-pipe").onclick = () => show("pipeline");
show("pipeline");
</script>
</body>
</html>
